[project]
name = "nexus-kitchen-mcp"
version = "0.1.0"
description = "Remote MCP connector for Nexus Kitchen"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4,<5",
    "httpx>=0.28",
    "pydantic>=2.9",
]

[project.scripts]
nexus-mcp = "nexus_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_mcp"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
