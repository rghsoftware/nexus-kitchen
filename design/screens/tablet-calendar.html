<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meal Plan · Tablet</title>
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  html, body { height: 100%; }
  body { background: var(--bg); overflow: hidden; }
  .app { display: grid; grid-template-columns: 96px 1fr; height: 100vh; }

  /* icon rail */
  .rail { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: var(--space-5) 0; gap: var(--space-2); }
  .rail__mark { width: 48px; height: 48px; border-radius: 14px; background: var(--primary); color: var(--text-on-accent); display: grid; place-items: center; font-size: 26px; margin-bottom: var(--space-4); }
  .rail__item { width: 68px; padding: var(--space-2) 0; border-radius: var(--radius-md); display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); text-decoration: none; }
  .rail__item i { font-size: 26px; }
  .rail__item span { font-size: 11px; font-weight: 600; }
  .rail__item--active { background: var(--primary-soft); color: var(--primary-text); }
  .rail__sep { width: 44px; height: 1px; background: var(--border); margin: var(--space-2) 0; }
  .rail__user { margin-top: auto; width: 44px; height: 44px; border-radius: 50%; background: var(--clay-200); color: var(--clay-600); display: grid; place-items: center; font-weight: 700; font-size: var(--text-sm); }

  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-5) var(--space-6); border-bottom: 1px solid var(--border); }
  .topbar h1 { font-size: var(--text-2xl); }
  .topbar p { font-size: var(--text-sm); color: var(--text-muted); }
  .weeknav { display: flex; align-items: center; gap: var(--space-2); margin-left: var(--space-3); }
  .weeknav__range { font-weight: 600; min-width: 130px; text-align: center; }
  .icon-btn { width: 44px; height: 44px; border-radius: var(--radius-md); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-secondary); display: grid; place-items: center; font-size: 1.1em; }
  .spacer { flex: 1; }
  /* operations summary */
  .ops { margin: var(--space-4) var(--space-6) 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: var(--space-4) var(--space-5); display: flex; align-items: center; gap: var(--space-5); flex-wrap: wrap; }
  .ops__counts { display: flex; gap: var(--space-5); }
  .ops__count { display: flex; flex-direction: column; gap: 3px; position: relative; padding-left: 16px; }
  .ops__count::before { content:""; position:absolute; left:0; top:7px; width:9px; height:9px; border-radius:50%; }
  .ops__count--have::before { background: var(--have); } .ops__count--make::before { background: var(--make); } .ops__count--acquire::before { background: var(--acquire); }
  .ops__count b { font-family: var(--font-display); font-size: var(--text-2xl); line-height: 1; font-variant-numeric: tabular-nums; }
  .ops__count span { font-size: var(--text-xs); color: var(--text-secondary); font-weight: 600; }
  .ops__bar { flex: 1; min-width: 120px; height: 12px; border-radius: 999px; overflow: hidden; display: flex; gap: 2px; background: var(--surface-2); }
  .ops__bar i { height: 100%; display: block; }
  .ops__bar .seg--have { background: var(--have); } .ops__bar .seg--make { background: var(--make); } .ops__bar .seg--acquire { background: var(--acquire); }
  .ops__gap { display: flex; align-items: center; gap: var(--space-3); margin-left: auto; }
  .ops__gap p { font-size: var(--text-sm); color: var(--text-secondary); max-width: 24ch; }
  .ops__gap b { color: var(--acquire-text); font-weight: 700; }

  .cal-scroll { flex: 1; overflow: auto; padding: var(--space-5) var(--space-6) var(--space-7); }
  .cal { display: grid; grid-template-columns: 80px repeat(7, minmax(0,1fr)); gap: var(--space-2); }
  .cal__day { padding: var(--space-2); text-align: center; }
  .cal__day b { font-family: var(--font-display); font-size: var(--text-lg); display: block; }
  .cal__day span { font-size: var(--text-2xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: var(--tracking-wide); font-weight: 700; }
  .cal__day--today { background: var(--primary-soft); border-radius: var(--radius-md); }
  .cal__day--today b { color: var(--primary-text); }
  .cal__slot { display: flex; align-items: center; justify-content: flex-end; gap: var(--space-2); padding-right: var(--space-2); padding-top: var(--space-3); font-size: 11px; font-weight: 700; letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--text-muted); }
  .cal__slot i { font-size: 1.3em; }

  .cell { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); min-height: 92px; padding: var(--space-2); display: flex; flex-direction: column; gap: var(--space-2); }
  .cell--today { background: color-mix(in oklab, var(--primary-soft) 50%, var(--surface)); }
  .cell--empty { justify-content: center; }
  .cell__add { flex: 1; min-height: 58px; border: 1.5px dashed var(--border-strong); border-radius: var(--radius-sm); background: transparent; color: var(--text-muted); display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: var(--text-sm); font-family: var(--font-sans); }
  .meal { display: flex; gap: var(--space-2); padding: var(--space-2); border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--border); align-items: flex-start; }
  .meal__tile { width: 30px; height: 30px; flex: none; border-radius: 8px; display: grid; place-items: center; font-size: 16px; }
  .meal__name { font-size: var(--text-sm); font-weight: 600; line-height: 1.2; }
  .meal__meta { display: flex; gap: 5px; margin-top: 4px; flex-wrap: wrap; }
  .tag { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 999px; }
  .tag--prepped { background: var(--info-soft); color: var(--info); }
  .tag--exp { background: var(--attention-soft); color: var(--attention); }
  [data-theme="dark"] .tag, [data-theme="dark"] .nk-req { filter: brightness(1.08); }
  .meal--takeout { background: var(--clay-50); border-color: color-mix(in oklab, var(--clay-500) 24%, transparent); }
</style>
</head>
<body data-theme="light">
  <div class="app">
    <nav class="rail">
      <div class="rail__mark"><i class="ph-fill ph-cooking-pot"></i></div>
      <a class="rail__item"><i class="ph ph-house"></i><span>Today</span></a>
      <a class="rail__item rail__item--active"><i class="ph-fill ph-calendar-dots"></i><span>Plan</span></a>
      <a class="rail__item"><i class="ph ph-book-open"></i><span>Recipes</span></a>
      <a class="rail__item"><i class="ph ph-shelves"></i><span>Pantry</span></a>
      <a class="rail__item"><i class="ph ph-shopping-cart-simple"></i><span>Shop</span></a>
      <div class="rail__sep"></div>
      <a class="rail__item"><i class="ph ph-cooking-pot"></i><span>Prep</span></a>
      <div class="rail__user">JR</div>
    </nav>

    <div class="main">
      <header class="topbar">
        <div><h1>Plan</h1><p>Each meal becomes a requirement — we track what's covered and what's left</p></div>
        <div class="weeknav">
          <button class="icon-btn"><i class="ph ph-caret-left"></i></button>
          <div class="weeknav__range">Dec 23 – 29</div>
          <button class="icon-btn"><i class="ph ph-caret-right"></i></button>
        </div>
        <div class="spacer"></div>
        <button class="nk-btn nk-btn--secondary"><i class="ph ph-shopping-cart-simple"></i> Build list</button>
        <button class="nk-btn nk-btn--primary"><i class="ph ph-sparkle"></i> Generate plan</button>
      </header>

      <div class="ops" id="ops"></div>

      <div class="cal-scroll nk-scroll"><div class="cal" id="cal"></div></div>
    </div>
  </div>
<script>
  const theme = new URLSearchParams(location.search).get('theme');
  if (theme === 'dark') document.body.setAttribute('data-theme','dark');

  const days=[{dow:'Mon',d:23},{dow:'Tue',d:24},{dow:'Wed',d:25,today:true},{dow:'Thu',d:26},{dow:'Fri',d:27},{dow:'Sat',d:28},{dow:'Sun',d:29}];
  const slots=[{key:'Breakfast',icon:'ph-coffee'},{key:'Lunch',icon:'ph-bowl-food'},{key:'Dinner',icon:'ph-fork-knife'},{key:'Snack',icon:'ph-cookie'}];
  // state: have (ready to eat) · make (ingredients on hand) · acquire (shop for it)
  const meals={
    Breakfast:[{n:'Overnight oats',icon:'ph-bowl-food',state:'make'},{n:'Eggs & toast',icon:'ph-egg',state:'make'},null,{n:'Berry smoothie',icon:'ph-blueprint',state:'acquire'},{n:'Overnight oats',icon:'ph-bowl-food',state:'make'},null,{n:'Pancakes',icon:'ph-stack',state:'acquire'}],
    Lunch:[{n:'Black bean soup',icon:'ph-bowl-food',state:'have',prepped:true,exp:true},{n:'Greek salad',icon:'ph-leaf',state:'make'},null,{n:'Marinara pasta',icon:'ph-cooking-pot',state:'have',prepped:true},{n:'Leftovers',icon:'ph-arrow-counter-clockwise',state:'have'},{n:'Burrito bowl',icon:'ph-bowl-food',state:'have',prepped:true},null],
    Dinner:[{n:'Chicken stir fry',icon:'ph-fork-knife',state:'make'},{n:'Takeout',icon:'ph-moped',state:'acquire',store:true},null,{n:'Sheet-pan salmon',icon:'ph-fish',state:'acquire'},{n:'Black bean soup',icon:'ph-bowl-food',state:'have',prepped:true},{n:'Chicken stir fry',icon:'ph-fork-knife',state:'make'},{n:'Burrito bowl',icon:'ph-bowl-food',state:'have',prepped:true}],
    Snack:[null,{n:'Yogurt & fruit',icon:'ph-bowl-food',state:'make'},null,null,null,{n:'Hummus & pita',icon:'ph-circle-half',state:'make'},null],
  };
  const STATE={have:{label:'Have it',icon:'ph-check-circle'},make:{label:'Can make it',icon:'ph-cooking-pot'},acquire:{label:'Need to get',icon:'ph-shopping-cart-simple'}};
  const cal=document.getElementById('cal');
  cal.appendChild(el('div',''));
  days.forEach(d=>{const c=el('div','cal__day'+(d.today?' cal__day--today':''));c.innerHTML=`<span>${d.dow}</span><b>${d.d}</b>`;cal.appendChild(c);});
  const tally={have:0,make:0,acquire:0};
  slots.forEach(s=>{
    const lab=el('div','cal__slot');lab.innerHTML=`<span>${s.key}</span><i class="ph ${s.icon}"></i>`;cal.appendChild(lab);
    days.forEach((d,i)=>{const m=meals[s.key][i];const cell=el('div','cell'+(d.today?' cell--today':'')+(m?'':' cell--empty'));
      if(!m){cell.innerHTML=`<button class="cell__add"><i class="ph ph-plus"></i> Add</button>`;}else{tally[m.state]++;cell.appendChild(mealEl(m));}cal.appendChild(cell);});
  });
  renderOps();
  function mealEl(m){const w=el('div','meal');const st=STATE[m.state];
    let t=`<span class="nk-req nk-req--${m.state}"><i class="ph ${st.icon}"></i> ${st.label}</span>`;
    if(m.exp)t+=`<span class="tag tag--exp"><i class="ph ph-warning-circle"></i> 2d</span>`;else if(m.prepped)t+=`<span class="tag tag--prepped"><i class="ph ph-snowflake"></i> Prepped</span>`;
    w.innerHTML=`<div class="meal__tile nk-tile--${m.state}"><i class="ph ${m.icon}"></i></div><div><div class="meal__name">${m.n}</div><div class="meal__meta">${t}</div></div>`;return w;}
  function renderOps(){const total=tally.have+tally.make+tally.acquire;const pct=k=>(tally[k]/total*100).toFixed(1)+'%';
    document.getElementById('ops').innerHTML=`
      <div class="ops__counts">
        <div class="ops__count ops__count--have"><b>${tally.have}</b><span>Have it</span></div>
        <div class="ops__count ops__count--make"><b>${tally.make}</b><span>Can make it</span></div>
        <div class="ops__count ops__count--acquire"><b>${tally.acquire}</b><span>Need to get</span></div>
      </div>
      <div class="ops__bar"><i class="seg--have" style="width:${pct('have')}"></i><i class="seg--make" style="width:${pct('make')}"></i><i class="seg--acquire" style="width:${pct('acquire')}"></i></div>
      <div class="ops__gap"><p><b>${tally.acquire} meals</b> still need a shop \u2014 5 items.</p><button class="nk-btn nk-btn--primary nk-btn--sm"><i class="ph ph-shopping-cart-simple"></i> Build list</button></div>`;}
  function el(t,c){const e=document.createElement(t);if(c)e.className=c;return e;}
</script>
</body>
</html>
