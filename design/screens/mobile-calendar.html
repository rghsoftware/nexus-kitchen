<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meal Plan · Mobile</title>
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  html, body { height: 100%; }
  body { background: var(--bg); display: flex; flex-direction: column; overflow: hidden; font-size: 16px; }

  /* status bar */
  .statusbar { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-6); flex: none; }
  .statusbar b { font-weight: 700; font-size: 15px; }
  .statusbar__right { display: flex; gap: 6px; align-items: center; font-size: 15px; }

  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  /* header */
  .mhead { padding: var(--space-2) var(--space-5) var(--space-4); flex: none; }
  .mhead__top { display: flex; align-items: center; justify-content: space-between; }
  .mhead__top h1 { font-size: var(--text-2xl); }
  .mhead__icons { display: flex; gap: var(--space-2); }
  .round-btn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary); display: grid; place-items: center; font-size: 1.2em; }

  /* energy card */
  .ecard { margin: 0 var(--space-5) var(--space-4); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-4); box-shadow: var(--shadow-sm); }
  .ecard__label { font-size: var(--text-sm); color: var(--text-secondary); font-weight: 600; margin-bottom: var(--space-3); display: flex; align-items: center; gap: var(--space-2); }
  .ecard__label i { color: var(--primary-text); font-size: 1.2em; }
  .ecard__opts { display: flex; gap: var(--space-2); justify-content: space-between; }
  .ebtn { flex: 1; height: 54px; border-radius: var(--radius-md); border: 2px solid transparent; background: var(--surface-2); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: var(--font-sans); }
  .ebtn__core { width: 16px; height: 16px; border-radius: 50%; }
  .ebtn__n { font-size: var(--text-xs); font-weight: 700; color: var(--text-muted); }
  .ebtn[data-e="1"] { background: var(--energy-1-soft); } .ebtn[data-e="1"] .ebtn__core { background: var(--energy-1); }
  .ebtn[data-e="2"] { background: var(--energy-2-soft); } .ebtn[data-e="2"] .ebtn__core { background: var(--energy-2); }
  .ebtn[data-e="3"] { background: var(--energy-3-soft); } .ebtn[data-e="3"] .ebtn__core { background: var(--energy-3); }
  .ebtn[data-e="4"] { background: var(--energy-4-soft); } .ebtn[data-e="4"] .ebtn__core { background: var(--energy-4); }
  .ebtn[data-e="5"] { background: var(--energy-5-soft); } .ebtn[data-e="5"] .ebtn__core { background: var(--energy-5); }
  .ebtn--sel { border-color: var(--energy-3); }
  .ebtn--sel .ebtn__n { color: var(--text); }

  /* week strip */
  .weekstrip { display: flex; gap: var(--space-2); padding: 0 var(--space-5) var(--space-4); overflow-x: auto; flex: none; }
  .weekstrip::-webkit-scrollbar { display: none; }
  .day { flex: none; width: 50px; height: 66px; border-radius: var(--radius-md); background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; }
  .day span { font-size: var(--text-2xs); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; color: var(--text-muted); }
  .day b { font-family: var(--font-display); font-size: var(--text-lg); }
  .day__dots { display: flex; gap: 3px; margin-top: 2px; }
  .day__dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--primary); opacity: 0.5; }
  .day--sel { background: var(--primary); border-color: var(--primary); }
  .day--sel span, .day--sel b { color: var(--text-on-accent); }
  .day--sel .day__dots i { background: var(--text-on-accent); opacity: 0.8; }

  /* meals list */
  .mlist { flex: 1; overflow-y: auto; padding: 0 var(--space-5) var(--space-7); }
  .slot { margin-top: var(--space-5); }
  .slot__head { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-3); }
  .slot__head i { color: var(--text-muted); font-size: 1.2em; }
  .slot__head span { font-size: var(--text-xs); font-weight: 700; letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--text-muted); }
  .slot__head em { margin-left: auto; font-style: normal; font-size: var(--text-xs); color: var(--text-muted); font-weight: 600; }

  .mmeal { display: flex; align-items: center; gap: var(--space-3); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-3); box-shadow: var(--shadow-sm); }
  .mmeal__tile { width: 46px; height: 46px; border-radius: var(--radius-sm); display: grid; place-items: center; font-size: 24px; flex: none; }
  .mmeal__body { flex: 1; min-width: 0; }
  .mmeal__name { font-weight: 600; font-size: var(--text-base); }
  .mmeal__meta { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; align-items: center; }
  .mmeal i.chev { color: var(--text-muted); font-size: 1.2em; }
  .tag { display: inline-flex; align-items: center; gap: 4px; font-size: var(--text-2xs); font-weight: 700; padding: 3px 8px; border-radius: 999px; }
  .tag--prepped { background: var(--info-soft); color: var(--info); }
  .tag--exp { background: var(--attention-soft); color: var(--attention); }
  .tag--e1 { background: var(--energy-1-soft); color: var(--energy-1); }
  .tag--e2 { background: var(--energy-2-soft); color: var(--energy-2); }
  .tag--e4 { background: var(--energy-4-soft); color: var(--energy-4); }
  .tag--time { background: var(--surface-2); color: var(--text-secondary); }
  [data-theme="dark"] .tag:not(.tag--time) { filter: brightness(1.08); }

  .addmeal { width: 100%; height: 56px; border: 1.5px dashed var(--border-strong); border-radius: var(--radius-md); background: transparent; color: var(--text-muted); font-weight: 600; font-size: var(--text-base); font-family: var(--font-sans); display: flex; align-items: center; justify-content: center; gap: var(--space-2); }

  /* FAB */
  .fab { position: absolute; right: var(--space-5); bottom: 92px; height: 54px; padding: 0 var(--space-5); border-radius: var(--radius-pill); background: var(--primary); color: var(--text-on-accent); border: none; font-family: var(--font-sans); font-weight: 700; font-size: var(--text-base); display: flex; align-items: center; gap: var(--space-2); box-shadow: var(--shadow-lg); }

  /* bottom tabs */
  .tabs { flex: none; display: flex; padding: var(--space-2) var(--space-4) var(--space-5); border-top: 1px solid var(--border); background: var(--surface); }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-muted); font-size: var(--text-2xs); font-weight: 600; }
  .tab i { font-size: 24px; }
  .tab--active { color: var(--primary-text); }
  .homebar { height: 5px; width: 134px; background: var(--text); opacity: 0.28; border-radius: 3px; margin: 8px auto 6px; }
</style>
</head>
<body data-theme="light">
  <div class="statusbar">
    <b>9:41</b>
    <div class="statusbar__right"><i class="ph-fill ph-cell-signal-full"></i> <i class="ph-fill ph-wifi-high"></i> <i class="ph-fill ph-battery-high"></i></div>
  </div>

  <div class="screen">
    <div class="mhead">
      <div class="mhead__top">
        <h1>This week</h1>
        <div class="mhead__icons">
          <button class="round-btn" aria-label="Search"><i class="ph ph-magnifying-glass"></i></button>
          <button class="round-btn" aria-label="Generate plan"><i class="ph ph-sparkle"></i></button>
        </div>
      </div>
    </div>

    <div class="ecard">
      <div class="ecard__label"><i class="ph ph-battery-medium"></i> Today I feel…</div>
      <div class="ecard__opts">
        <button class="ebtn" data-e="1"><div class="ebtn__core"></div><span class="ebtn__n">Low</span></button>
        <button class="ebtn" data-e="2"><div class="ebtn__core"></div><span class="ebtn__n">2</span></button>
        <button class="ebtn ebtn--sel" data-e="3"><div class="ebtn__core"></div><span class="ebtn__n">Steady</span></button>
        <button class="ebtn" data-e="4"><div class="ebtn__core"></div><span class="ebtn__n">4</span></button>
        <button class="ebtn" data-e="5"><div class="ebtn__core"></div><span class="ebtn__n">High</span></button>
      </div>
    </div>

    <div class="weekstrip">
      <div class="day"><span>Mon</span><b>23</b><div class="day__dots"><i></i><i></i><i></i></div></div>
      <div class="day"><span>Tue</span><b>24</b><div class="day__dots"><i></i><i></i><i></i></div></div>
      <div class="day day--sel"><span>Wed</span><b>25</b><div class="day__dots"><i></i></div></div>
      <div class="day"><span>Thu</span><b>26</b><div class="day__dots"><i></i><i></i><i></i></div></div>
      <div class="day"><span>Fri</span><b>27</b><div class="day__dots"><i></i><i></i></div></div>
      <div class="day"><span>Sat</span><b>28</b><div class="day__dots"><i></i><i></i><i></i></div></div>
      <div class="day"><span>Sun</span><b>29</b><div class="day__dots"><i></i><i></i></div></div>
    </div>

    <div class="mlist nk-scroll">
      <div class="slot">
        <div class="slot__head"><i class="ph ph-coffee"></i> <span>Breakfast</span></div>
        <div class="addmeal"><i class="ph ph-plus"></i> Add breakfast</div>
      </div>

      <div class="slot">
        <div class="slot__head"><i class="ph ph-bowl-food"></i> <span>Lunch</span></div>
        <div class="mmeal">
          <div class="mmeal__tile" style="background:var(--energy-2-soft);color:var(--energy-2)"><i class="ph ph-leaf"></i></div>
          <div class="mmeal__body">
            <div class="mmeal__name">Greek salad jar</div>
            <div class="mmeal__meta"><span class="tag tag--e2">Low energy</span><span class="tag tag--time">10 min</span></div>
          </div>
          <i class="ph ph-caret-right chev"></i>
        </div>
      </div>

      <div class="slot">
        <div class="slot__head"><i class="ph ph-fork-knife"></i> <span>Dinner</span></div>
        <div class="mmeal">
          <div class="mmeal__tile" style="background:var(--info-soft);color:var(--info)"><i class="ph ph-cooking-pot"></i></div>
          <div class="mmeal__body">
            <div class="mmeal__name">Marinara pasta</div>
            <div class="mmeal__meta"><span class="tag tag--prepped"><i class="ph ph-snowflake"></i> Prepped</span><span class="tag tag--time">Reheat · 12 min</span></div>
          </div>
          <i class="ph ph-caret-right chev"></i>
        </div>
      </div>

      <div class="slot">
        <div class="slot__head"><i class="ph ph-cookie"></i> <span>Snack</span><em>optional</em></div>
        <div class="addmeal"><i class="ph ph-plus"></i> Add a snack</div>
      </div>
    </div>
  </div>

  <button class="fab"><i class="ph ph-sparkle"></i> Plan my week</button>

  <nav class="tabs">
    <a class="tab"><i class="ph ph-house"></i> Today</a>
    <a class="tab tab--active"><i class="ph-fill ph-calendar-dots"></i> Plan</a>
    <a class="tab"><i class="ph ph-book-open"></i> Recipes</a>
    <a class="tab"><i class="ph ph-shelves"></i> Pantry</a>
    <a class="tab"><i class="ph ph-cooking-pot"></i> Prep</a>
  </nav>
  <div class="homebar"></div>

<script>
  const theme = new URLSearchParams(location.search).get('theme');
  if (theme === 'dark') document.body.setAttribute('data-theme','dark');
</script>
</body>
</html>
