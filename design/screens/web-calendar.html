<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meal Plan · Web</title>
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  html, body { height: 100%; }
  body { background: var(--bg-sunken); overflow: hidden; }
  .app { display: grid; grid-template-columns: 248px 1fr; height: 100vh; }

  /* ---------- Sidebar ---------- */
  .side { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: var(--space-5) var(--space-4); }
  .side__logo { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-2) var(--space-6); }
  .side__mark { width: 38px; height: 38px; border-radius: 11px; background: var(--primary); color: var(--text-on-accent); display: grid; place-items: center; font-size: 21px; }
  .side__name { font-family: var(--font-display); font-weight: 700; font-size: var(--text-lg); letter-spacing: -0.02em; }
  .side__name span { color: var(--primary-text); }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav__item { display: flex; align-items: center; gap: var(--space-3); height: 46px; padding: 0 var(--space-3); border-radius: var(--radius-md); color: var(--text-secondary); font-weight: 600; font-size: var(--text-base); cursor: pointer; text-decoration: none; transition: background var(--transition), color var(--transition); }
  .nav__item i { font-size: 1.32em; }
  .nav__item:hover { background: var(--surface-2); color: var(--text); }
  .nav__item--active { background: var(--primary-soft); color: var(--primary-text); }
  .nav__sep { height: 1px; background: var(--border); margin: var(--space-4) var(--space-2); }
  .side__foot { margin-top: auto; }
  .side__user { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2); border-radius: var(--radius-md); cursor: pointer; }
  .side__user:hover { background: var(--surface-2); }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--clay-200); color: var(--clay-600); display: grid; place-items: center; font-weight: 700; font-size: var(--text-sm); }
  .side__user b { font-size: var(--text-sm); display: block; }
  .side__user span { font-size: var(--text-xs); color: var(--text-muted); }

  /* ---------- Main ---------- */
  .main { display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
  .topbar { display: flex; align-items: center; gap: var(--space-5); padding: var(--space-5) var(--space-7); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .topbar__title h1 { font-size: var(--text-2xl); }
  .topbar__title p { font-size: var(--text-sm); color: var(--text-muted); margin-top: 2px; }
  .weeknav { display: flex; align-items: center; gap: var(--space-2); margin-left: var(--space-2); }
  .weeknav__range { font-weight: 600; font-size: var(--text-base); min-width: 150px; text-align: center; }
  .icon-btn { width: 40px; height: 40px; border-radius: var(--radius-md); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-secondary); display: grid; place-items: center; cursor: pointer; font-size: 1.1em; transition: background var(--transition), color var(--transition); }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .spacer { flex: 1; }

  /* energy selector in header */
  .energy-now { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4); border: 1px solid var(--border); border-radius: var(--radius-pill); background: var(--surface); }
  .energy-now__label { font-size: var(--text-sm); color: var(--text-secondary); font-weight: 600; }
  .energy-now__opts { display: flex; gap: 4px; }
  .energy-dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; display: grid; place-items: center; transition: transform var(--transition); }
  .energy-dot:hover { transform: scale(1.12); }
  .energy-dot[data-e="1"] { background: var(--energy-1-soft); }
  .energy-dot[data-e="2"] { background: var(--energy-2-soft); }
  .energy-dot[data-e="3"] { background: var(--energy-3-soft); }
  .energy-dot[data-e="4"] { background: var(--energy-4-soft); }
  .energy-dot[data-e="5"] { background: var(--energy-5-soft); }
  .energy-dot--sel { border-color: currentColor; }
  .energy-dot[data-e="1"].energy-dot--sel { color: var(--energy-1); }
  .energy-dot[data-e="3"].energy-dot--sel { color: var(--energy-3); }
  .energy-dot__core { width: 11px; height: 11px; border-radius: 50%; }
  .energy-dot[data-e="1"] .energy-dot__core { background: var(--energy-1); }
  .energy-dot[data-e="2"] .energy-dot__core { background: var(--energy-2); }
  .energy-dot[data-e="3"] .energy-dot__core { background: var(--energy-3); }
  .energy-dot[data-e="4"] .energy-dot__core { background: var(--energy-4); }
  .energy-dot[data-e="5"] .energy-dot__core { background: var(--energy-5); }

  /* assist strip */
  .assist { display: flex; align-items: center; gap: var(--space-3); margin: var(--space-4) var(--space-7) 0; padding: var(--space-3) var(--space-4); background: var(--primary-soft); border: 1px solid color-mix(in oklab, var(--primary) 22%, transparent); border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--primary-text); }
  .assist i { font-size: 1.2em; }
  .assist b { font-weight: 700; }
  .assist a { margin-left: auto; color: var(--primary-text); font-weight: 700; text-decoration: none; white-space: nowrap; }

  /* ---------- Calendar ---------- */
  .cal-scroll { flex: 1; overflow: auto; padding: var(--space-5) var(--space-7) var(--space-8); }
  .cal { display: grid; grid-template-columns: 92px repeat(7, minmax(150px, 1fr)); gap: var(--space-2); min-width: 1040px; }
  .cal__corner { }
  .cal__day { padding: var(--space-2) var(--space-3); text-align: center; position: sticky; top: 0; }
  .cal__day b { font-family: var(--font-display); font-size: var(--text-lg); display: block; }
  .cal__day span { font-size: var(--text-xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: var(--tracking-wide); font-weight: 600; }
  .cal__day--today b { color: var(--primary-text); }
  .cal__day--today { background: var(--primary-soft); border-radius: var(--radius-md); }

  .cal__slot { display: flex; align-items: center; justify-content: flex-end; gap: var(--space-2); padding: var(--space-3) var(--space-3) 0 0; font-size: var(--text-xs); font-weight: 700; letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--text-muted); text-align: right; }
  .cal__slot i { font-size: 1.3em; color: var(--text-muted); }

  .cell { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); min-height: 96px; padding: var(--space-2); display: flex; flex-direction: column; gap: var(--space-2); transition: border-color var(--transition); }
  .cell--today { background: color-mix(in oklab, var(--primary-soft) 50%, var(--surface)); }
  .cell--empty { align-items: stretch; justify-content: center; }
  .cell__add { flex: 1; min-height: 60px; border: 1.5px dashed var(--border-strong); border-radius: var(--radius-sm); background: transparent; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: var(--space-2); font-weight: 600; font-size: var(--text-sm); font-family: var(--font-sans); transition: border-color var(--transition), color var(--transition), background var(--transition); }
  .cell__add:hover { border-color: var(--primary); color: var(--primary-text); background: var(--primary-soft); }

  .meal { display: flex; gap: var(--space-2); padding: var(--space-2); border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--border); cursor: grab; align-items: flex-start; }
  .meal:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
  .meal__tile { width: 30px; height: 30px; flex: none; border-radius: 8px; display: grid; place-items: center; font-size: 16px; }
  .meal__body { min-width: 0; flex: 1; }
  .meal__name { font-size: var(--text-sm); font-weight: 600; line-height: 1.2; }
  .meal__meta { display: flex; align-items: center; gap: 5px; margin-top: 4px; flex-wrap: wrap; }
  .tag { display: inline-flex; align-items: center; gap: 3px; font-size: var(--text-2xs); font-weight: 700; padding: 2px 6px; border-radius: 999px; letter-spacing: 0.01em; }
  .tag--prepped { background: var(--info-soft); color: var(--info); }
  .tag--exp { background: var(--attention-soft); color: var(--attention); }
  .tag--e1 { background: var(--energy-1-soft); color: var(--energy-1); }
  .tag--e2 { background: var(--energy-2-soft); color: var(--energy-2); }
  .tag--e3 { background: var(--energy-3-soft); color: var(--energy-3); }
  .tag--e4 { background: var(--energy-4-soft); color: var(--energy-4); }
  .tag--e5 { background: var(--energy-5-soft); color: var(--energy-5); }
  [data-theme="dark"] .tag { filter: brightness(1.08); }

  .meal--takeout { background: var(--clay-50); border-color: color-mix(in oklab, var(--clay-500) 24%, transparent); }
</style>
</head>
<body data-theme="light">
  <div class="app">
    <!-- SIDEBAR -->
    <aside class="side">
      <div class="side__logo">
        <div class="side__mark"><i class="ph-fill ph-cooking-pot"></i></div>
        <div class="side__name">Nexus <span>Kitchen</span></div>
      </div>
      <nav class="nav">
        <a class="nav__item"><i class="ph ph-house"></i> Today</a>
        <a class="nav__item nav__item--active"><i class="ph ph-calendar-dots"></i> Plan</a>
        <a class="nav__item"><i class="ph ph-book-open"></i> Recipes</a>
        <a class="nav__item"><i class="ph ph-shelves"></i> Pantry</a>
        <a class="nav__item"><i class="ph ph-shopping-cart-simple"></i> Shopping</a>
        <div class="nav__sep"></div>
        <a class="nav__item"><i class="ph ph-cooking-pot"></i> Meal prep</a>
      </nav>
      <div class="side__foot">
        <div class="nav__sep"></div>
        <div class="side__user">
          <div class="avatar">JR</div>
          <div><b>Jordan's kitchen</b><span>2 people</span></div>
        </div>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main">
      <header class="topbar">
        <div class="topbar__title">
          <h1>Plan</h1>
          <p>Tap any slot to add a meal — drag to move it.</p>
        </div>
        <div class="weeknav">
          <button class="icon-btn" aria-label="Previous week"><i class="ph ph-caret-left"></i></button>
          <div class="weeknav__range">Dec 23 – 29</div>
          <button class="icon-btn" aria-label="Next week"><i class="ph ph-caret-right"></i></button>
        </div>
        <button class="nk-btn nk-btn--secondary nk-btn--sm">Today</button>
        <div class="spacer"></div>
        <div class="energy-now">
          <span class="energy-now__label">Today I feel</span>
          <div class="energy-now__opts">
            <div class="energy-dot" data-e="1"><div class="energy-dot__core"></div></div>
            <div class="energy-dot" data-e="2"><div class="energy-dot__core"></div></div>
            <div class="energy-dot energy-dot--sel" data-e="3"><div class="energy-dot__core"></div></div>
            <div class="energy-dot" data-e="4"><div class="energy-dot__core"></div></div>
            <div class="energy-dot" data-e="5"><div class="energy-dot__core"></div></div>
          </div>
        </div>
        <button class="nk-btn nk-btn--primary"><i class="ph ph-sparkle"></i> Generate plan</button>
      </header>

      <div class="assist">
        <i class="ph ph-battery-medium"></i>
        <span><b>Energy-aware planning is on.</b> Simpler meals show up on your typically lower-energy days. Always yours to change.</span>
        <a href="#">Adjust</a>
      </div>

      <div class="cal-scroll nk-scroll">
        <div class="cal" id="cal"></div>
      </div>
    </div>
  </div>

<script>
  // theme from URL
  const theme = new URLSearchParams(location.search).get('theme');
  if (theme === 'dark') document.body.setAttribute('data-theme','dark');

  const days = [
    { dow:'Mon', d:23 }, { dow:'Tue', d:24 }, { dow:'Wed', d:25, today:true },
    { dow:'Thu', d:26 }, { dow:'Fri', d:27 }, { dow:'Sat', d:28 }, { dow:'Sun', d:29 },
  ];
  const slots = [
    { key:'Breakfast', icon:'ph-coffee' },
    { key:'Lunch', icon:'ph-bowl-food' },
    { key:'Dinner', icon:'ph-fork-knife' },
    { key:'Snack', icon:'ph-cookie' },
  ];
  // meals[slot][dayIndex] = meal | null
  const E = (n)=>`tag--e${n}`;
  const meals = {
    Breakfast: [
      {n:'Overnight oats', icon:'ph-bowl-food', tile:5, tags:[['e',2]]},
      {n:'Eggs & toast', icon:'ph-egg', tile:5, tags:[['e',2]]},
      null,
      {n:'Berry smoothie', icon:'ph-blueprint', tile:4, tags:[['e',1]]},
      {n:'Overnight oats', icon:'ph-bowl-food', tile:5, tags:[['e',2]]},
      null,
      {n:'Pancakes', icon:'ph-stack', tile:5, tags:[['e',4]]},
    ],
    Lunch: [
      {n:'Black bean soup', icon:'ph-bowl-food', tile:3, tags:[['prepped'],['exp']]},
      {n:'Greek salad jar', icon:'ph-leaf', tile:3, tags:[['e',2]]},
      null,
      {n:'Marinara pasta', icon:'ph-cooking-pot', tile:5, tags:[['prepped']]},
      {n:'Leftovers', icon:'ph-arrow-counter-clockwise', tile:2, tags:[['e',1]]},
      {n:'Burrito bowl', icon:'ph-bowl-food', tile:4, tags:[['prepped']]},
      null,
    ],
    Dinner: [
      {n:'Chicken stir fry', icon:'ph-fork-knife', tile:4, tags:[['e',4]]},
      {n:'Marinara pasta', icon:'ph-cooking-pot', tile:5, tags:[['prepped']]},
      null,
      {n:'Takeout', icon:'ph-moped', takeout:true, tags:[['e',1]]},
      {n:'Black bean soup', icon:'ph-bowl-food', tile:3, tags:[['prepped']]},
      {n:'Sheet-pan salmon', icon:'ph-fish', tile:4, tags:[['e',4]]},
      {n:'Burrito bowl', icon:'ph-bowl-food', tile:4, tags:[['prepped']]},
    ],
    Snack: [
      null, {n:'Yogurt & fruit', icon:'ph-bowl-food', tile:4, tags:[['e',1]]}, null, null,
      null, {n:'Hummus & pita', icon:'ph-circle-half', tile:3, tags:[['e',1]]}, null,
    ],
  };

  const cal = document.getElementById('cal');
  // header row
  cal.appendChild(el('div','cal__corner'));
  days.forEach(d => {
    const c = el('div','cal__day' + (d.today?' cal__day--today':''));
    c.innerHTML = `<span>${d.dow}</span><b>${d.d}</b>`;
    cal.appendChild(c);
  });
  // slot rows
  slots.forEach(s => {
    const lab = el('div','cal__slot');
    lab.innerHTML = `<span>${s.key}</span><i class="ph ${s.icon}"></i>`;
    cal.appendChild(lab);
    days.forEach((d,i) => {
      const m = meals[s.key][i];
      const cell = el('div','cell' + (d.today?' cell--today':'') + (m?'':' cell--empty'));
      if (!m) {
        cell.innerHTML = `<button class="cell__add"><i class="ph ph-plus"></i> Add</button>`;
      } else {
        cell.appendChild(mealEl(m));
      }
      cal.appendChild(cell);
    });
  });

  function mealEl(m){
    const wrap = el('div','meal' + (m.takeout?' meal--takeout':''));
    const tileColor = m.takeout ? 'var(--clay-100)' : `var(--energy-${m.tile}-soft)`;
    const iconColor = m.takeout ? 'var(--clay-600)' : `var(--energy-${m.tile})`;
    let tagsHtml = '';
    (m.tags||[]).forEach(t => {
      if (t[0]==='prepped') tagsHtml += `<span class="tag tag--prepped"><i class="ph ph-snowflake"></i> Prepped</span>`;
      else if (t[0]==='exp') tagsHtml += `<span class="tag tag--exp"><i class="ph ph-warning-circle"></i> 2 days</span>`;
      else if (t[0]==='e') tagsHtml += `<span class="tag tag--e${t[1]}">${['','Low','Low','Steady','Good','Hi'][t[1]]}</span>`;
    });
    wrap.innerHTML = `
      <div class="meal__tile" style="background:${tileColor};color:${iconColor}"><i class="ph ${m.icon}"></i></div>
      <div class="meal__body">
        <div class="meal__name">${m.n}</div>
        <div class="meal__meta">${tagsHtml}</div>
      </div>`;
    return wrap;
  }
  function el(tag, cls){ const e = document.createElement(tag); if(cls) e.className = cls; return e; }
</script>
</body>
</html>
